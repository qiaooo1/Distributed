server:
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 500ms
      timeout: 500ms
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1500
            response-timeout: 5s
          routes:
            - id: scheduler
              uri: lb://scheduler-service
              predicates:
                - Path=/api/auth/token,/api/jobs,/api/jobs/**,/api/schedules,/api/schedules/**,/api/admin/members,/api/admin/members/**,/api/operations/**,/api/tickets/**
              filters:
                - RemoveRequestHeader=X-JobLab-Internal-Key
                - DedupeResponseHeader=X-Request-Id, RETAIN_FIRST
    loadbalancer:
      cache:
        enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
    instance-id: ${spring.application.name}:${HOSTNAME:${random.uuid}}:${server.port}

joblab:
  rate-limit: ${JOB_RATE_LIMIT:60}
  login-rate-limit: ${JOB_LOGIN_RATE_LIMIT:30}
  ticket-rate-limit: ${TICKET_RATE_LIMIT:300}

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
