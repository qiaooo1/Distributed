global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: joblab-gateway
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["gateway"]
        type: A
        port: 8080

  - job_name: joblab-scheduler
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["scheduler"]
        type: A
        port: 8081

  - job_name: joblab-worker
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8082
